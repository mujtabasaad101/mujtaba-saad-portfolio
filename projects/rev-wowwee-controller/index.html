<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R.E.V Controller</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--mut:#8b949e;--acc:#2f81f7;--ok:#3fb950;--red:#f85149;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--fg:#1f2328;--mut:#656d76;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;flex:none}
.bar h1{font-size:16px;margin:0;margin-right:auto;white-space:nowrap}
.st{font-size:12px;color:var(--mut);white-space:nowrap}.st b{color:var(--red)}.st.on b{color:var(--ok)}
.bar button{border:0;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;background:var(--acc);color:#fff}
.bar button.sec{background:var(--card);color:var(--fg);border:1px solid #8b949e55}
button:disabled{opacity:.4}
.main{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 18px 28px}
.side{display:flex;flex-direction:column;align-items:center}
.trk{background:var(--card);border:2px solid #8b949e55;border-radius:60px;position:relative;touch-action:none;flex:none}
#thr{width:92px;height:min(46vh,300px)}
#str{width:min(58vw,300px);height:92px}
.kn{position:absolute;width:70px;height:70px;border-radius:50%;background:var(--acc);box-shadow:0 4px 16px #0006;left:50%;top:50%;margin:-35px 0 0 -35px}
.lb{font-size:10px;color:var(--mut);text-align:center;margin-top:8px;letter-spacing:.08em}
#hud{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);text-align:center;pointer-events:none;padding:0 120px}
#log{display:none;position:fixed;left:14px;right:14px;bottom:10px;height:90px;overflow:auto;background:var(--card);border-radius:10px;padding:8px;font:11px ui-monospace,monospace;color:var(--mut);touch-action:pan-y;user-select:text;z-index:5}
#log.show{display:block}
@media (orientation:landscape){.main{align-items:center;padding-bottom:14px}#thr{height:min(100%,300px)}#str{width:min(34vw,320px)}.bar{flex-wrap:nowrap;padding:6px 14px}#hud{padding:0 34vw}}
</style>
</head>
<body>
<div class="bar">
<h1>R.E.V Controller</h1>
<div class="st" id="st"><b>&#9679;</b> Disconnected</div>
<button id="conn">Connect</button>
<button id="all" class="sec">All devices</button>
<button id="disc" class="sec" disabled>Disconnect</button>
<button id="fs" class="sec">&#9974;</button>
<button id="lg" class="sec">Log</button>
</div>
<div id="hud"></div>
<div class="main">
<div class="side"><div class="trk" id="thr"><div class="kn" id="kt"></div></div><div class="lb">FRONT / BACK</div></div>
<div class="side"><div class="trk" id="str"><div class="kn" id="ks"></div></div><div class="lb">LEFT / RIGHT</div></div>
</div>
<div id="log"></div>
<script>
const U=s=>`0000${s}-0000-1000-8000-00805f9b34fb`;
const SVC_DRIVE=U('ffe5'),CH_DRIVE=U('ffe9'),SVC_NOTIF=U('ffe0'),CH_NOTIF=U('ffe4');
const HANDSHAKE=[[0x16],[0x91,0x01],[0x84,0x04],[0x79],[0x91,0x01],[0x19],[0x91,0xFF],[0x14]];
const $=id=>document.getElementById(id);
const logEl=$('log');
const log=m=>{logEl.textContent+=m+'\\n';logEl.scrollTop=logEl.scrollHeight;$('hud').textContent=m};
const hex=b=>[...new Uint8Array(b.buffer||b)].map(x=>x.toString(16).padStart(2,'0')).join(' ');
let dev=null,chDrive=null,busy=false,lastPkt='',ticker=null;
const jx={x:0,y:0},keys={};
function setStatus(on,t){const s=$('st');s.className='st'+(on?' on':'');s.innerHTML='<b>●</b> '+t;$('disc').disabled=!on;$('conn').disabled=on;$('all').disabled=on}
async function write(data,withResp){if(!chDrive)return;const d=data instanceof Uint8Array?data:new Uint8Array(data);if(withResp&&chDrive.writeValueWithResponse)return chDrive.writeValueWithResponse(d);if(chDrive.writeValueWithoutResponse)return chDrive.writeValueWithoutResponse(d);return chDrive.writeValue(d)}
async function connect(all){
if(!navigator.bluetooth){log('Web Bluetooth not supported. Use Android Chrome / desktop Chrome or Edge over HTTPS.');return}
try{
const opts=all?{acceptAllDevices:true,optionalServices:[SVC_DRIVE,SVC_NOTIF]}:{filters:[{namePrefix:'REV'}],optionalServices:[SVC_DRIVE,SVC_NOTIF]};
log('Scanning...');dev=await navigator.bluetooth.requestDevice(opts);dev.addEventListener('gattserverdisconnected',onDisc);
log('Connecting to '+(dev.name||dev.id)+'...');const srv=await dev.gatt.connect();chDrive=await (await srv.getPrimaryService(SVC_DRIVE)).getCharacteristic(CH_DRIVE);
try{const n=await (await srv.getPrimaryService(SVC_NOTIF)).getCharacteristic(CH_NOTIF);await n.startNotifications();n.addEventListener('characteristicvaluechanged',e=>log('notify: '+hex(e.target.value)))}catch(e){log('Notify skipped: '+e.message)}
log('Sending handshake...');for(const p of HANDSHAKE){await write(p,true);await new Promise(r=>setTimeout(r,40))}
log('Ready! Drive away.');setStatus(true,'Connected: '+(dev.name||'car'));lastPkt='';ticker=setInterval(tick,60)
}catch(e){log('Error: '+e.message);setStatus(false,'Disconnected');chDrive=null}
}
function onDisc(){clearInterval(ticker);chDrive=null;setStatus(false,'Disconnected');log('Car disconnected.')}
function disconnect(){if(chDrive)write([0x78,0,0],false).catch(()=>{});if(dev&&dev.gatt.connected)dev.gatt.disconnect()}
function pkt(x,y){const dz=.12;let sp=0,st=0;if(Math.abs(y)>dz){const v=Math.round(31*Math.min(1,Math.abs(y)));sp=y>0?v:0x20+v}if(Math.abs(x)>dz){const v=Math.round(31*Math.min(1,Math.abs(x)));st=x>0?0x40+v:0x60+v}return [0x78,sp,st]}
async function tick(){if(!chDrive||busy)return;let x=jx.x,y=jx.y;if(keys.ArrowUp||keys.w)y=1;if(keys.ArrowDown||keys.s)y=-1;if(keys.ArrowRight||keys.d)x=1;if(keys.ArrowLeft||keys.a)x=-1;const p=pkt(x,y),k=p.join();if(k===lastPkt&&p[1]===0&&p[2]===0)return;busy=true;try{await write(p,false);lastPkt=k}catch(e){log('write err: '+e.message)}busy=false}
function axis(el,kn,ax,set){let on=false;const mv=e=>{const r=el.getBoundingClientRect();let v=ax==='y'?-((e.clientY-(r.top+r.height/2))/((r.height-68)/2)):(e.clientX-(r.left+r.width/2))/((r.width-68)/2);v=Math.max(-1,Math.min(1,v));set(v);const px=v*((ax==='y'?r.height:r.width)-68)/2;kn.style.transform=ax==='y'?`translateY(${-px}px)`:`translateX(${px}px)`};const rel=()=>{on=false;set(0);kn.style.transform=''};el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);mv(e)});el.addEventListener('pointermove',e=>{if(on)mv(e)});el.addEventListener('pointerup',rel);el.addEventListener('pointercancel',rel)}
axis($('thr'),$('kt'),'y',v=>jx.y=v);axis($('str'),$('ks'),'x',v=>jx.x=v);
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
$('conn').onclick=()=>connect(false);$('all').onclick=()=>connect(true);$('disc').onclick=disconnect;
$('fs').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};
$('lg').onclick=()=>logEl.classList.toggle('show');
if(!navigator.bluetooth)log('Web Bluetooth unavailable in this browser (iOS/Safari not supported).');
</script>
</body>
</html>
