<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mujtaba Saad — Electronics, ESP32, AI Agents & Web</title>
<meta name="description" content="Mujtaba Saad — electronics, ESP32 home automation, AI agents, web development and software, from Karachi.">
<meta property="og:title" content="Mujtaba Saad — Portfolio"><meta property="og:description" content="Electronics, ESP32, home automation, AI agents and web development."><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<script>try{var m=localStorage.getItem("ms_mode");if(m)document.documentElement.dataset.theme=m}catch(e){}</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..500&family=Plus+Jakarta+Sans:wght@300..800&family=Space+Grotesk:wght@400;500;600&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#D8B168;--amber:#F08C35;--bg:#0c0d10;--card:rgba(35,38,47,.45);--stage:rgba(17,19,23,.92);--tx:#f3eee5;--mut:#b5a793;--ln:rgba(216,177,104,.22);--on:#1a1200;--g1:#fce5b8;--g3:var(--amber);--bp:linear-gradient(135deg,#f6cc81,var(--gold));--bpb:#ffdea5;--ph:linear-gradient(160deg,#1b1c22,#0c0d10);--bdbg:rgba(12,13,16,.8);--gobo:rgba(0,0,0,.22);--tint:rgba(255,255,255,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme=light]{--bg:#FFFAF0;--card:rgba(224,224,224,.5);--stage:rgba(224,224,224,.6);--tx:#2b0d0d;--mut:#6f4f4f;--ln:rgba(105,19,19,.24);--on:#FFFAF0;--g1:var(--gold);--g3:color-mix(in srgb,var(--gold) 55%,var(--amber));--bp:linear-gradient(135deg,color-mix(in srgb,var(--gold) 80%,#000),var(--gold));--bpb:var(--gold);--ph:linear-gradient(160deg,#E0E0E0,color-mix(in srgb,var(--amber) 55%,#E0E0E0));--bdbg:rgba(255,250,240,.88);--gobo:rgba(105,19,19,.05);--tint:rgba(105,19,19,.05);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:84px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/24px 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{margin:0}
a{color:inherit;text-decoration:none}
.mono{font:600 11px/16px 'Space Grotesk',monospace;letter-spacing:.14em;text-transform:uppercase}
.gold{background:linear-gradient(135deg,var(--g1),var(--gold) 45%,var(--g3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.serif{font-family:'EB Garamond',Georgia,serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,64px)}
section{padding:88px 0;position:relative}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--gold),var(--amber));z-index:90}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--amber) 13%,transparent),transparent 65%);transform:translate(-50%,-50%);left:50%;top:30%}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--ln)}
nav .wrap{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
nav .links{display:flex;gap:28px}nav .links a{color:var(--mut);transition:color .2s}nav .links a:hover,nav .links a.on{color:var(--gold)}
.logo{font:500 24px 'EB Garamond',serif;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:6px;font:600 11px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);cursor:pointer;transition:.25s;background:var(--card);color:var(--gold)}
.btn:hover{color:var(--tx);transform:translateY(-2px)}
.btn.p{background:var(--bp);color:var(--on);border-color:var(--bpb)}
.btn.p:hover{box-shadow:0 0 28px color-mix(in srgb,var(--amber) 55%,transparent);color:var(--on)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.glass{background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--ln);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,235,190,.14),0 24px 60px -12px color-mix(in srgb,var(--amber) 12%,transparent)}
/* hero */
#hero{padding:112px 0 56px;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:radial-gradient(ellipse 65% 55% at 50% 25%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%),repeating-linear-gradient(118deg,rgba(0,0,0,.4) 0 42px,transparent 42px 110px)}
:root[data-theme=light] #hero{background:radial-gradient(ellipse 65% 55% at 50% 25%,color-mix(in srgb,var(--amber) 38%,transparent),transparent 70%),repeating-linear-gradient(118deg,rgba(105,19,19,.04) 0 42px,transparent 42px 110px)}
#hero .wrap{width:100%;position:relative;z-index:2}
.rib{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--mut);margin-right:6px}
.pill.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.stage{position:relative;border-radius:16px;padding:clamp(18px,3vw,48px);overflow:hidden;background:var(--stage);border:1px solid var(--ln);box-shadow:0 0 25px -5px color-mix(in srgb,var(--gold) 10%,transparent),inset 0 1px 0 rgba(255,235,190,.15)}
.cn{position:absolute;width:16px;height:16px;border:2px solid color-mix(in srgb,var(--gold) 60%,transparent);z-index:3}
.cn.a{top:12px;left:12px;border-right:0;border-bottom:0}.cn.b{top:12px;right:12px;border-left:0;border-bottom:0}.cn.c{bottom:12px;left:12px;border-right:0;border-top:0}.cn.d{bottom:12px;right:12px;border-left:0;border-top:0}
#cv{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.pb{position:relative;z-index:2;display:flex;justify-content:space-between;gap:14px;max-width:880px;margin:0 auto 32px;padding:8px 26px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--mut)}
.pb i{color:color-mix(in srgb,var(--gold) 45%,transparent);font-style:normal}
.wm{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:800 clamp(110px,22vw,290px)/1 Syne;white-space:nowrap;letter-spacing:-.04em;pointer-events:none;user-select:none;background:linear-gradient(145deg,color-mix(in srgb,var(--amber) 55%,transparent),color-mix(in srgb,var(--gold) 12%,transparent) 70%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.6;overflow:hidden}
.hg{display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:center;position:relative;z-index:2}
.hg>*{min-width:0}
.ey{display:flex;align-items:center;gap:12px;color:var(--gold);margin-bottom:12px}.ey i{height:1px;width:40px;background:linear-gradient(90deg,var(--gold),transparent)}
h1{font:800 clamp(44px,6.2vw,80px)/1.05 Syne,sans-serif;letter-spacing:-.03em}
h1 span{display:block;white-space:nowrap}
.tl{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;margin:14px 0 24px}
.tl b{font:700 clamp(16px,2vw,22px) Syne;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.tl em{font:italic 400 clamp(18px,2vw,24px) 'EB Garamond',serif;color:var(--mut)}
.mf{padding:22px 24px;max-width:560px;position:relative}
.mf p{margin:0 0 16px;font-size:16px;line-height:26px}
.mf .q{font:800 40px/.5 Syne;color:color-mix(in srgb,var(--gold) 45%,transparent);display:block;margin-bottom:8px}
.mf .nt{display:flex;flex-wrap:wrap;gap:8px 22px;border-top:1px solid var(--ln);padding-top:12px;color:var(--gold)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.soc a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--mut);transition:.25s;font:500 12px 'Space Grotesk'}
.soc a:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.pt{position:relative;max-width:420px;justify-self:end;width:100%}
.pt:before{content:"";position:absolute;inset:-8% -10%;background:radial-gradient(circle,color-mix(in srgb,var(--amber) 22%,transparent),transparent 65%);filter:blur(30px);z-index:0}
.fr{position:relative;padding:8px;border-radius:12px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--card);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.ph{aspect-ratio:4/5;border-radius:8px;overflow:hidden;position:relative;display:grid;place-items:center;background:var(--ph)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,var(--gobo) 0 36px,transparent 36px 96px);pointer-events:none}
.ph b{font:800 clamp(90px,12vw,150px) Syne}
.bd{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--bdbg)}
.bd b{display:block;font:500 17px 'EB Garamond',serif;color:var(--tx)}
.fo{position:absolute;top:-14px;left:-14px;z-index:3;padding:6px 14px;border-radius:99px;color:var(--gold);background:var(--bdbg);border:1px solid var(--ln);backdrop-filter:blur(12px)}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px;position:relative;z-index:2}
.st{padding:20px 22px;border-radius:10px;background:var(--card);border:1px solid var(--ln)}
.st b{display:block;font:800 clamp(30px,4vw,44px)/1 Syne}
.st .mono{display:block;color:var(--tx);margin-top:8px}.st small{color:var(--mut)}
/* strip */
.mq{display:flex;align-items:center;border-block:1px solid var(--ln);position:relative;z-index:2;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.mq>.mono{padding:0 24px;color:var(--gold);white-space:nowrap;border-right:1px solid var(--ln);align-self:stretch;display:flex;align-items:center}
.mq .tr{overflow:hidden;flex:1;padding:18px 0}
.mq .tr div{display:flex;gap:28px;width:max-content;animation:mq 40s linear infinite;font:500 22px 'EB Garamond',serif;color:var(--mut)}
.mq .tr span:nth-child(even){color:var(--gold);font-size:14px;align-self:center}
@keyframes mq{to{transform:translateX(-50%)}}
/* sections */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.hd .pill{margin:0 0 14px}
h2{font:400 clamp(32px,4.6vw,48px)/1.12 'EB Garamond',serif;letter-spacing:-.015em;max-width:640px}
.lead{color:var(--mut);max-width:560px;margin:14px 0 0}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{padding:26px;position:relative;transition:transform .25s,border-color .25s;transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.card:hover{border-color:var(--gold)}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--amber) 18%,transparent),transparent)}
.card:hover:before{opacity:1}
.ic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:22px;border:1px solid var(--ln);background:var(--tint)}
.sk{display:flex;gap:14px;align-items:center;margin-bottom:16px}.sk .mono{color:var(--mut);font-size:10px}
.sk h3{font:500 24px/1.15 'EB Garamond',serif}
.card p{color:var(--mut);margin:0 0 14px}
.chip{display:inline-block;padding:2px 9px;border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:99px;background:var(--tint);color:var(--mut);margin:0 5px 5px 0;font:600 10px/16px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase}
.bar{height:3px;background:var(--tint);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--gold),var(--amber));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.rv:not(.on) .bar i{width:0}
.ft{display:flex;justify-content:space-between;color:var(--gold);margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.fl{display:flex;gap:6px;flex-wrap:wrap;padding:6px;border-radius:99px;border:1px solid var(--ln);background:var(--card)}
.fl button{cursor:pointer;font:600 10px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:99px;border:0;background:none;color:var(--mut);transition:.2s}
.fl button.a,.fl button:hover{background:var(--gold);color:var(--on)}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.pc{padding:16px;display:flex;flex-direction:column}
.pm{aspect-ratio:16/10;border-radius:8px;overflow:hidden;position:relative;background:var(--ph);display:grid;place-items:center}
.pm img,.pm video{width:100%;height:100%;object-fit:cover;display:block}
.pm .ov{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.pm .ov span{padding:3px 12px;border-radius:99px;background:var(--bdbg);color:var(--tx);backdrop-filter:blur(10px)}
.pm .ov span+span{background:var(--gold);color:var(--on)}
.pm em{font:italic 500 56px 'EB Garamond',serif;color:color-mix(in srgb,var(--gold) 35%,transparent)}
.pi{padding:18px 8px 6px;display:flex;flex-direction:column;flex:1}
.pi .r{display:flex;justify-content:space-between;color:var(--gold);margin-bottom:12px}.pi .r span+span{color:var(--mut)}
.pi h3{font:500 clamp(22px,2.4vw,28px)/1.2 'EB Garamond',serif;margin-bottom:10px}.pi p{color:var(--mut);margin:0 0 14px}
.pi .ft{margin-top:auto}.pi .ft span:first-child{color:var(--mut)}
.qt{text-align:center;padding:96px 0}
.qt .cir{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;margin:0 auto 28px;color:var(--gold);font:800 16px Syne;background:var(--card)}
blockquote{margin:0 auto;max-width:860px;font:italic 400 clamp(26px,4vw,40px)/1.3 'EB Garamond',serif}
.qt b{display:block;margin-top:28px}.qt small{color:var(--gold)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:clamp(24px,4vw,56px)}
.cg ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px;color:var(--mut)}.cg li:before{content:"◆";color:var(--gold);margin-right:10px;font-size:10px}
.ct{padding:28px;display:grid;gap:14px;background:var(--stage)}
.ct h3{font:500 26px 'EB Garamond',serif}
.ct input,.ct textarea,.ct select,.ad input,.ad textarea,.ad select{width:100%;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--ln);padding:10px 2px;font:inherit;border-radius:0;transition:.2s}
.ct select option,.ad select option{background:var(--bg)}
.ct input:focus,.ct textarea:focus,.ad input:focus,.ad textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 8px 8px -8px color-mix(in srgb,var(--amber) 50%,transparent)}
footer{border-top:1px solid var(--ln);padding:32px 0;color:var(--mut)}footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}footer .soc{margin:0}
.fi{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes in{from{transform:translateY(24px)}to{opacity:1;transform:none}}
.rv{transition:opacity .8s,transform .8s}.rv:not(.on){opacity:0;transform:translateY(28px)}
.noanim *{animation:none!important;transition:none!important}.noanim .fi,.noanim .rv{opacity:1!important;transform:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fi,.rv{opacity:1!important;transform:none!important}}
@media(max-width:900px){.hg,.cg{grid-template-columns:1fr}.pt{justify-self:center;max-width:340px}.sg,.pg{grid-template-columns:1fr 1fr}.sts{grid-template-columns:1fr 1fr}nav .links,.pb{display:none}.mq>.mono{display:none}}
@media(max-width:600px){.sg,.pg{grid-template-columns:1fr}section{padding:64px 0}nav .btn.p{display:none}}
/* cloud images */
.cl{position:absolute;pointer-events:none;overflow:hidden;z-index:0;-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);mix-blend-mode:screen;opacity:.5}
.cl img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.2)}
.cl.iv img{filter:grayscale(1) invert(1)}
.cl:after{content:"";position:absolute;inset:0;background:var(--gold);mix-blend-mode:color}
:root[data-theme=light] .cl{mix-blend-mode:multiply;opacity:.55}
:root[data-theme=light] .cl.iv img{filter:grayscale(1)}
.cl.h{right:-8%;top:-15%;width:62%;height:130%}
.cl.sc{right:-14%;top:-22%;width:78%;height:92%;opacity:.42}
:root[data-theme=light] .cl.sc{opacity:.5}
.card>*{position:relative;z-index:1}.card>.cl{position:absolute;z-index:0}
.sg .card{overflow:hidden}
.pm:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,color-mix(in srgb,var(--bg) 60%,transparent),transparent 50%)}
.pm.tn:after{content:"";position:absolute;inset:0;z-index:1;background:var(--gold);mix-blend-mode:color;opacity:.55;pointer-events:none}
.pm .ov{z-index:2}
.tg{padding:9px 14px}
/* admin */
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;width:48px;height:48px;padding:0;border-radius:50%;font-size:20px;display:none}
#lock{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;place-items:center}
#lock .glass{padding:32px;width:min(340px,90vw);display:grid;gap:14px;background:var(--bg)}
#lock input{background:transparent;border:1px solid var(--ln);color:var(--tx);padding:12px;border-radius:6px;font:500 15px 'Plus Jakarta Sans',sans-serif}
.ad{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:95;background:var(--bg);border-left:1px solid var(--ln);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ad.open{transform:none}
.ad header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.tabs{display:flex;gap:4px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--ln)}
.tabs button{white-space:nowrap;background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:6px;cursor:pointer;font:500 12px 'Space Grotesk'}
.tabs button.a{background:var(--gold);color:var(--on)}
.body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.ad label{display:block;margin-bottom:14px;color:var(--mut);font:500 11px 'Space Grotesk';letter-spacing:.08em}
.ad label input[type=color]{height:40px;padding:0;border:1px solid var(--ln)}
.ad label input[type=checkbox]{width:auto;margin-right:8px}
.it{border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:10px}
.ad textarea{min-height:70px;resize:vertical}
.md{height:110px;border:1px dashed var(--ln);border-radius:8px;overflow:hidden;display:grid;place-items:center;margin:6px 0 8px;color:var(--mut)}.md img,.md video{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="prog"></div><div id="glow"></div>
<div id="app"></div>

if(tab=="profile")h=media("profile.avatar","HERO PHOTO","image/*")+chk("profile.avail","Show availability text")+PF.map(([k,l,t])=>inp("profile."+k,l,t)).join("")+`<hr style="border-color:var(--ln)"><b class="mono" style="color:var(--gold)">Stats</b><br><br>`+S.stats.map((s,i)=>`<div class="it">${inp(`stats.${i}.n`,"VALUE")}${inp(`stats.${i}.l`,"LABEL")}${inp(`stats.${i}.s`,"SUBTEXT")}</div>`).join("");
if(tab=="links")h=inp("profile.gh","GITHUB URL","url")+inp("profile.fb","FACEBOOK URL","url")+inp("profile.wa","WHATSAPP NUMBER (COUNTRY CODE, NO +)")+`<p style="color:var(--mut)">Leave a field empty to hide that button.</p>`;
if(tab=="skills")h=S.skills.map((s,i)=>`<div class="it">${tools("skills",i)}${inp(`skills.${i}.ic`,"ICON (EMOJI)")}${inp(`skills.${i}.t`,"TITLE")}${inp(`skills.${i}.d`,"DESCRIPTION","area")}${inp(`skills.${i}.tags`,"TAGS (COMMA SEPARATED)")}${inp(`skills.${i}.lv`,"LEVEL 0–100","number")}</div>`).join("")+`<button class="btn p" data-a="add" data-l="skills">Add skill</button>`;
if(tab=="projects")h=S.projects.map((s,i)=>`<div class="it">${tools("projects",i)}${media(`projects.${i}.img`,"COVER IMAGE","image/*")}${media(`projects.${i}.vid`,"VIDEO","video/*")}${inp(`projects.${i}.t`,"TITLE")}${inp(`projects.${i}.c`,"CATEGORY")}${inp(`projects.${i}.y`,"YEAR")}${inp(`projects.${i}.d`,"DESCRIPTION","area")}${inp(`projects.${i}.tags`,"TAGS (COMMA SEPARATED)")}${inp(`projects.${i}.by`,"CLIENT / CONTEXT")}${inp(`projects.${i}.u`,"LIVE LINK (OPTIONAL)","url")}</div>`).join("")+`<button class="btn p" data-a="add" data-l="projects">Add project</button>`;
if(tab=="theme")h=`<label>DEFAULT MODE (VISITORS CAN SWITCH)<select data-p="theme.mode"><option value="dark" ${S.theme.mode=="dark"?"selected":""}>Dark (Nocturne)</option><option value="light" ${S.theme.mode=="light"?"selected":""}>Light</option></select></label>`+inp("theme.gold","LIGHT THEME ACCENT","color")+inp("theme.amber","LIGHT THEME GLOW","color")+inp("theme.goldD","DARK THEME ACCENT","color")+inp("theme.amberD","DARK THEME GLOW","color")+inp("theme.bgl","BACKGROUND (LIGHT MODE)","color")+inp("theme.bg","BACKGROUND (DARK MODE)","color")+chk("theme.tint","Tint images to match theme")+chk("theme.clouds","Soft cloud images")+chk("theme.anim","Animations on")+chk("theme.circuit","Hero circuit animation")+chk("theme.glow","Cursor glow")+`<button class="btn" data-a="theme">Reset theme colors</button>`;
if(tab=="data")h=`<p style="color:var(--mut)">Edits preview instantly. Press <b>Save &amp; publish</b> (top) to store them in Supabase so every visitor sees them. The backup below is an optional manual copy.</p><button class="btn p" data-a="exp">Show backup</button><label style="margin-top:14px">BACKUP / RESTORE<textarea id="bk" style="min-height:200px"></textarea></label><div class="row" style="justify-content:flex-start"><button class="btn" data-a="cp">Copy backup</button><button class="btn" data-a="imp">Restore from text</button><button class="btn" data-a="rst">Reset everything</button></div>`;
$("#body").innerHTML=h}
$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;admin()}};
$("#ad").addEventListener("input",e=>{const p=e.target.dataset.p;if(!p||e.target.dataset.a)return;if(p=="theme.mode"){mode=e.target.value;try{localStorage.setItem("ms_mode",mode)}catch(x){}}set(p,e.target.type=="checkbox"?e.target.checked:e.target.type=="number"?+e.target.value:e.target.value);save();site()});
$("#ad").addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const{a,l,i,p,k}=b.dataset,n=+i;
if(a=="pick"){pick(k,async f=>{b.textContent="Uploading…";try{set(p,await up(f));save();site();admin()}catch(x){b.textContent="Choose file";alert(x.message||"Upload failed.")}});return}
if(a=="clr"){set(p,"")}
if(a=="add")S[l].push(l=="skills"?{ic:"✨",t:"New skill",d:"Describe it.",tags:"Tag",lv:70}:{t:"New project",c:"Web",y:String(new Date().getFullYear()),d:"What it does.",tags:"Tag",by:"",u:"",img:"",vid:""});
if(a=="del"&&confirm("Delete this item?"))S[l].splice(n,1);
if(a=="mu"&&n>0)[S[l][n-1],S[l][n]]=[S[l][n],S[l][n-1]];
if(a=="md"&&n<S[l].length-1)[S[l][n+1],S[l][n]]=[S[l][n],S[l][n+1]];
if(a=="theme")Object.assign(S.theme,{gold:D.theme.gold,amber:D.theme.amber,goldD:D.theme.goldD,amberD:D.theme.amberD,bg:D.theme.bg,bgl:D.theme.bgl,mode:D.theme.mode});
if(a=="exp"){$("#bk").value=JSON.stringify(S,null,1);return}
if(a=="cp"){$("#bk").select();try{navigator.clipboard.writeText($("#bk").value)}catch(x){}return}
if(a=="imp"){try{S=mg(JSON.parse($("#bk").value))}catch(x){alert("That text isn’t a valid backup.");return}}
if(a=="rst"){if(!confirm("Reset all content and settings?"))return;S=clone(D)}
save();site();admin()});
const lock=$("#lock"),ad=$("#ad");
function openAdmin(){if(owner){ad.classList.add("open");admin();return}lock.style.display="grid";$("#pin").value="";$("#pe").textContent="";$("#em2").focus()}
$("#fab").onclick=()=>{if(ad.classList.contains("open"))return ad.classList.remove("open");openAdmin()};
$("#go").onclick=async()=>{if(!sb){$("#pe").textContent=NOSB;return}
const{error}=await sb.auth.signInWithPassword({email:$("#em2").value.trim(),password:$("#pin").value});
if(error){$("#pe").textContent=error.message;return}
owner=true;$("#fab").style.display="flex";lock.style.display="none";$("#pin").value="";ad.classList.add("open");admin()};
$("#pin").onkeydown=$("#em2").onkeydown=e=>{if(e.key=="Enter")$("#go").click();if(e.key=="Escape")lock.style.display="none"};
lock.onclick=e=>{if(e.target==lock)lock.style.display="none"};
$("#x").onclick=()=>ad.classList.remove("open");
boot();
</script>
